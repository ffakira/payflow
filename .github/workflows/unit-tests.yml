name: unit_test

on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: payflow-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Java 21 Tests
    runs-on: ubuntu-latest
    timeout-minutes: 15

    services:
      postgres:
        image: postgres:18-alpine
        env:
          POSTGRES_DB: payflow
          POSTGRES_USER: payflow
          POSTGRES_PASSWORD: payflow_ci_password
        ports:
          - 5433:5432
        options: >-
          --health-cmd "pg_isready -U payflow -d payflow"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

      kafka:
        image: apache/kafka:4.1.2
        ports:
          - 9092:9092
        options: >-
          --health-cmd "/opt/kafka/bin/kafka-broker-api-versions.sh
          --bootstrap-server localhost:9092"
          --health-interval 10s
          --health-timeout 10s
          --health-retries 12
          --health-start-period 20s

    env:
      DB_PASSWORD: payflow_ci_password
      SPRING_KAFKA_BOOTSTRAP_SERVERS: localhost:9092

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java 21
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'
          cache: gradle

      - name: Make Gradle wrapper executable
        run: chmod +x gradlew

      - name: Verify service connectivity
        run: |
          pg_isready -h localhost -p 5433 -U payflow -d payflow
          docker run --rm --network host apache/kafka:4.1.2 \
            /opt/kafka/bin/kafka-broker-api-versions.sh \
            --bootstrap-server localhost:9092

      - name: Run tests and verify build
        run: ./gradlew --no-daemon --console=plain clean check

      - name: Upload JaCoCo report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: jacoco-report
          path: build/reports/jacoco/test/
          if-no-files-found: ignore
          retention-days: 7

      - name: Upload test report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-report
          path: build/reports/tests/test/
          if-no-files-found: ignore
          retention-days: 7
