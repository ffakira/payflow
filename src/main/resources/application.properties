spring.application.name=payflow

# Application environment
payflow.environment=sandbox

# PostgreSQL datasource
spring.datasource.url=jdbc:postgresql://localhost:5433/payflow
spring.datasource.username=payflow
spring.datasource.password=${DB_PASSWORD}
spring.datasource.hikari.minimum-idle=2
spring.datasource.hikari.connection-timeout=3000

# Kafka
spring.kafka.bootstrap-servers=localhost:9092

# Producer
spring.kafka.producer.key-serializer=org.apache.kafka.common.serialization.StringSerializer
spring.kafka.producer.value-serializer=org.apache.kafka.common.serialization.StringSerializer

# Consumer
spring.kafka.consumer.group-id=payflow
spring.kafka.consumer.auto-offset-reset=earliest
spring.kafka.consumer.key-deserializer=org.apache.kafka.common.serialization.StringDeserializer
spring.kafka.consumer.value-deserializer=org.apache.kafka.common.serialization.StringDeserializer

# JPA / Hibernate
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false

# Flyway migrations
spring.flyway.enabled=true

# Thymeleaf
spring.thymeleaf.cache=false

# Virtual threads
spring.threads.virtual.enabled=true

# Expose datasource pool metrics through Actuator when installed
management.endpoints.web.exposure.include=health,metrics
