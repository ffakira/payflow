
spring.application.name=payflow

# PostgreSQL datasource
spring.datasource.url=jdbc:postgresql://localhost:5433/payflow
spring.datasource.username=payflow
spring.datasource.password=${DB_PASSWORD}
spring.datasource.hikari.minimum-idle=2
spring.datasource.hikari.maximum-pool-size=10

# JPA / Hibernate
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false

# Flyway migrations
spring.flyway.enabled=true

# Thymeleaf
spring.thymeleaf.cache=false

# Virtual threads
spring.threads.virtual.enabled=true

# JDBC connection pool
spring.datasource.hikari.maximum-pool-size=10
spring.datasource.hikari.connection-timeout=3000

# Expose datasource pool metrics through Actuator when installed
management.endpoints.web.exposure.include=health,metrics

# Application environment
payflow.environment=sandbox
