<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<body>

<th:block th:fragment="sidebar(active)">
    <!-- Brand -->
    <div class="sidebar__brand">
        <div class="brand-mark" aria-hidden="true">
            <svg viewBox="0 0 24 24" width="20" height="20" fill="none">
                <path d="M7 17V7h6.2a3.3 3.3 0 0 1 0 6.6H7" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/>
                <path d="M11 10.3h3.7a2.3 2.3 0 0 1 0 4.7H11" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"/>
            </svg>
        </div>
        <span>PayFlow</span>
    </div>

    <!-- Navigation -->
    <nav aria-label="Main navigation">
        <ul class="nav-list">
            <li>
                <a th:href="@{/overview}" class="nav-link" th:attrappend="aria-current=${active == 'overview'} ? 'page' : null">
                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" aria-hidden="true">
                        <rect x="4" y="4" width="6" height="6" rx="1.5"/><rect x="14" y="4" width="6" height="6" rx="1.5"/>
                        <rect x="4" y="14" width="6" height="6" rx="1.5"/><rect x="14" y="14" width="6" height="6" rx="1.5"/>
                    </svg>
                    Overview
                </a>
            </li>
            <li>
                <a th:href="@{/accounts}" class="nav-link" th:attrappend="aria-current=${active == 'accounts'} ? 'page' : null">
                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" aria-hidden="true">
                        <rect x="3.5" y="5" width="17" height="14" rx="3"/><path d="M3.5 9.5h17M7 15h3"/>
                    </svg>
                    Accounts
                </a>
            </li>
            <li>
                <a th:href="@{/transfers}" class="nav-link" th:attrappend="aria-current=${active == 'transfers'} ? 'page' : null">
                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" aria-hidden="true">
                        <path d="M5 8h14m0 0-3-3m3 3-3 3M19 16H5m0 0 3 3m-3-3 3-3"/>
                    </svg>
                    Transfer
                </a>
            </li>
            <li>
                <a th:href="@{/exchange}" class="nav-link" th:attrappend="aria-current=${active == 'exchange'} ? 'page' : null">
                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                        <path d="M7 7h11m0 0-3-3m3 3-3 3M17 17H6m0 0 3 3m-3-3 3-3"/>
                    </svg>
                    Currency exchange
                </a>
            </li>
            <li>
                <a th:href="@{/transactions}" class="nav-link" th:attrappend="aria-current=${active == 'transactions'} ? 'page' : null">
                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" aria-hidden="true">
                        <path d="M6 3.5h12v17l-3-2-3 2-3-2-3 2v-17Z"/><path d="M9 8h6M9 12h6"/>
                    </svg>
                    Transactions
                </a>
            </li>
        </ul>
    </nav>

    <!-- Sandbox Mode Card -->
    <div class="sidebar__sandbox">
        <div class="sidebar__sandbox-icon">
            <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                <path d="M12 3 5 6v5c0 4.6 2.8 8.2 7 10 4.2-1.8 7-5.4 7-10V6l-7-3Z"/>
                <path d="m9 12 2 2 4-4"/>
            </svg>
        </div>
        <p class="sidebar__sandbox-title">Sandbox mode</p>
        <p class="sidebar__sandbox-text">No real funds are moved while testing.</p>
    </div>

    <!-- User Profile -->
    <button type="button" class="sidebar__profile">
        <div class="avatar">JD</div>
        <div class="sidebar__profile-info">
            <p class="sidebar__profile-name">Jordan Davis</p>
            <p class="sidebar__profile-role">Developer</p>
        </div>
        <svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true">
            <path d="m9 18 6-6-6-6"/>
        </svg>
    </button>
</th:block>

</body>
</html>
