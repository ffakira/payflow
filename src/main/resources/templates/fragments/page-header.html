<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<body>

            class="page-header">
        <div class="page-header__content">
            <h1 th:text="${title}">Dashboard</h1>

        </div>
    </header>
</body>
</html>
