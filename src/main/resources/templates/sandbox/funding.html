<!DOCTYPE html>
<html lang="en"
      xmlns:th="http://www.thymeleaf.org"
      th:replace="~{layouts/app :: layout(~{::content}, 'Add funds', 'funding')}">
<body>
<th:block th:fragment="content">
    <div class="funding-page">

        <div class="funding-page__icon" aria-hidden="true">
            <svg viewBox="0 0 24 24" width="20" height="20"
                 fill="none" stroke="currentColor" stroke-width="2"
                 stroke-linecap="round">
                <path d="M12 5v14M5 12h14"/>
            </svg>
        </div>

        <div th:replace="~{fragments/page-header :: pageHeader(
            'Add funds',
            'Simulate a deposit into one of your PayFlow sandbox accounts.'
        )}"></div>

        <div class="funding-layout">
            <section class="card funding-card"
                     aria-labelledby="funding-form-heading">

                <div class="card__header funding-card__header">
                    <div>
                        <h2 class="card__title" id="funding-form-heading">
                            Sandbox deposit
                        </h2>
                        <p class="card__description">
                            Add test funds to a customer account.
                        </p>
                    </div>

                    <span class="badge badge--warning">Sandbox only</span>
                </div>

                <!-- 1. REPLACED the entire <form> block with this fragment include -->
                <div th:replace="~{fragments/funding-form :: funding-form}"></div>

            </section>

            <!-- Info aside -->
            <aside class="funding-info" aria-labelledby="funding-info-heading">
                <div class="funding-info__icon" aria-hidden="true">
                    <svg viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor"
                         stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
                        <path d="M12 3 5 6v5c0 4.6 2.8 8.2 7 10 4.2-1.8 7-5.4 7-10V6l-7-3Z"/>
                        <path d="m9 12 2 2 4-4"/>
                    </svg>
                </div>
                <h2 class="funding-info__title" id="funding-info-heading">Safe to experiment</h2>
                <p class="funding-info__description">
                    Sandbox funding is intended for testing. It creates a
                    simulated deposit in PayFlow and does not move real money.
                </p>
                <hr class="funding-info__divider">
                <dl class="funding-info__details">
                    <div>
                        <dt>Environment</dt>
                        <dd><span class="badge badge--warning">Sandbox</span></dd>
                    </div>
                    <div>
                        <dt>Purpose</dt>
                        <dd>Test account funding</dd>
                    </div>
                </dl>
            </aside>
        </div>
    </div>

    <!-- The Alpine.js component registration stays here -->
    <script>
        document.addEventListener('alpine:init', () => {
            Alpine.data('fundingForm', () => ({
                isOpen: false,
                search: '',
                selectedValue: '',
                selectedCurrency: '',
                selectedAccountNumber: '',
                selectedPrefix: '',
                selectedSuffix: '',
                accountError: '',
                amountError: '',

                init() {
                    const select = this.$refs.nativeSelect;
                    if (select && select.value) {
                        this.selectedValue = select.value;
                        const option = select.options[select.selectedIndex];
                        this.selectedCurrency = option.getAttribute('data-currency');
                        const text = option.text;
                        const parts = text.split('·');
                        this.selectedAccountNumber = parts.length > 1 ? parts[1].trim() : text;
                        this.updateCurrency();
                    }
                },

                toggleDropdown() {
                    this.isOpen = !this.isOpen;
                    if (this.isOpen) {
                        this.search = '';
                        this.$nextTick(() => {
                            this.$refs.searchInput.focus();
                        });
                    }
                },

                closeDropdown() {
                    this.isOpen = false;
                },

                selectAccount(el) {
                    const value = el.getAttribute('data-value');
                    const currency = el.getAttribute('data-currency');
                    const number = el.getAttribute('data-number');

                    this.selectedValue = value;
                    this.selectedCurrency = currency;
                    this.selectedAccountNumber = number;

                    this.$refs.nativeSelect.value = value;
                    this.$refs.nativeSelect.dispatchEvent(new Event('change', { bubbles: true }));
                    this.$refs.nativeSelect.setAttribute('aria-invalid', 'false');

                    this.accountError = '';
                    this.updateCurrency();
                    this.closeDropdown();
                },

                isSelected(id) {
                    return this.selectedValue === id;
                },

                updateCurrency() {
                    if (!this.selectedCurrency) {
                        this.selectedPrefix = '';
                        this.selectedSuffix = '';
                        return;
                    }

                    try {
                        const currencyPart = new Intl.NumberFormat(undefined, {
                            style: 'currency',
                            currency: this.selectedCurrency
                        })
                            .formatToParts(0)
                            .find(part => part.type === 'currency');

                        this.selectedPrefix = currencyPart?.value ?? this.selectedCurrency;
                        this.selectedSuffix = this.selectedCurrency;
                    } catch (error) {
                        this.selectedPrefix = this.selectedCurrency;
                        this.selectedSuffix = this.selectedCurrency;
                    }
                },

                matchesSearch(text) {
                    if (!this.search) return true;
                    return text.toLowerCase().includes(this.search.toLowerCase());
                },

                hasVisibleAccounts() {
                    if (!this.$refs.nativeSelect) return true;
                    const options = this.$refs.nativeSelect.options;
                    for (let i = 1; i < options.length; i++) {
                        const currency = options[i].getAttribute('data-currency') || '';
                        const text = options[i].text || '';
                        if (this.matchesSearch(`${currency} ${text}`)) {
                            return true;
                        }
                    }
                    return false;
                },

                validateForm(e) {
                    let isValid = true;

                    if (this.selectedValue === '') {
                        isValid = false;
                        this.accountError = 'Please select a customer account.';
                        this.$refs.nativeSelect.setAttribute('aria-invalid', 'true');
                    }

                    const amountInput = this.$refs.amountInput;
                    if (!amountInput.checkValidity()) {
                        isValid = false;
                        amountInput.setAttribute('aria-invalid', 'true');

                        let msg = 'Please enter a valid amount.';
                        if (amountInput.validity.valueMissing) {
                            msg = 'Please enter an amount to deposit.';
                        } else if (amountInput.validity.rangeOverflow) {
                            msg = 'Amount is too large. Maximum is 999,999,999,999.99.';
                        } else if (amountInput.validity.rangeUnderflow) {
                            msg = 'Amount must be at least 0.01.';
                        } else if (amountInput.validity.stepMismatch) {
                            msg = 'Please use a maximum of 2 decimal places.';
                        }

                        this.amountError = msg;
                    }

                    if (!isValid) {
                        e.preventDefault();
                        if (this.accountError) {
                            this.$refs.trigger.focus();
                        } else if (this.amountError) {
                            amountInput.focus();
                        }
                    }
                }
            }));
        });
    </script>
</th:block>
</body>
</html>
